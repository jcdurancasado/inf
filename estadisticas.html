<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('jcdc_theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = saved || (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
        if (sessionStorage.getItem('jcdc_booted') === '1') {
          document.documentElement.classList.add('jcdc-booted');
        }
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#00f0ff" />
  <title>Estadísticas del sitio — JCDC</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@400;500;600&family=Share+Tech+Mono&display=swap" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="icon" type="image/png" href="img/foto.png" />
  <link rel="stylesheet" href="css/style.css" />

  <script data-goatcounter="https://jcdurancasado.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>

  <style>
    .stats-page { padding-top: calc(var(--header-height) + var(--space-2xl)); padding-bottom: var(--space-2xl); min-height: 100vh; }
    .stats-page__header { text-align: center; margin-bottom: var(--space-2xl); }
    .stats-page__title { font-family: var(--font-display); font-size: clamp(1.6rem, 4vw, 2.4rem); font-weight: 800; margin: var(--space-md) 0; letter-spacing: -0.02em; }
    .stats-page__lead { color: var(--text-secondary); max-width: 560px; margin: 0 auto; line-height: 1.7; }
    .stats-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-md); max-width: 900px; margin: 0 auto var(--space-2xl); }
    .stats-summary__card { padding: var(--space-lg) var(--space-md); background: var(--bg-panel); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); text-align: center; transition: border-color 0.3s ease, transform 0.3s ease; }
    .stats-summary__card:hover { border-color: var(--border-medium); transform: translateY(-4px); }
    .stats-summary__icon { width: 48px; height: 48px; margin: 0 auto var(--space-sm); display: flex; align-items: center; justify-content: center; background: rgba(0, 240, 255, 0.06); border: 1px solid var(--border-subtle); border-radius: 50%; color: var(--neon-cyan); font-size: 1.15rem; }
    .stats-summary__value { font-family: var(--font-display); font-size: clamp(1.6rem, 3.5vw, 2.2rem); font-weight: 800; background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1; letter-spacing: -0.02em; }
    .stats-summary__label { font-family: var(--font-mono); font-size: 0.68rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 0.5rem; }
    .stats-chart { max-width: 900px; margin: 0 auto var(--space-2xl); padding: var(--space-xl); background: var(--bg-panel); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); }
    .stats-chart__title { font-family: var(--font-display); font-size: 0.95rem; color: var(--neon-cyan); margin-bottom: var(--space-lg); letter-spacing: 0.05em; }
    .stats-chart__bars { display: flex; align-items: flex-end; justify-content: space-between; gap: 0.5rem; height: 220px; padding-bottom: var(--space-sm); border-bottom: 1px solid var(--border-subtle); margin-bottom: var(--space-md); overflow-x: auto; }
    .stats-chart__bar { flex: 1; min-width: 32px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 0.5rem; height: 100%; transition: transform 0.3s ease; cursor: pointer; }
    .stats-chart__bar:hover { transform: translateY(-4px); }
    .stats-chart__bar-fill { width: 100%; min-height: 4px; background: linear-gradient(180deg, var(--neon-cyan), var(--neon-purple)); border-radius: 4px 4px 0 0; transition: height 0.6s cubic-bezier(0.22, 1, 0.36, 1); box-shadow: 0 0 12px rgba(0, 240, 255, 0.3); }
    .stats-chart__bar-value { font-family: var(--font-display); font-size: 0.7rem; font-weight: 700; color: var(--neon-cyan); opacity: 0; transition: opacity 0.2s ease; white-space: nowrap; }
    .stats-chart__bar:hover .stats-chart__bar-value { opacity: 1; }
    .stats-chart__labels { display: flex; justify-content: space-between; gap: 0.5rem; overflow-x: auto; }
    .stats-chart__bar-label { flex: 1; min-width: 32px; text-align: center; font-family: var(--font-mono); font-size: 0.6rem; color: var(--text-muted); letter-spacing: 0.05em; text-transform: uppercase; white-space: nowrap; }
    .stats-lists { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-md); max-width: 900px; margin: 0 auto var(--space-2xl); }
    .stats-list { padding: var(--space-lg); background: var(--bg-panel); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); }
    .stats-list__title { font-family: var(--font-display); font-size: 0.85rem; color: var(--neon-cyan); margin-bottom: var(--space-md); letter-spacing: 0.05em; display: flex; align-items: center; gap: 0.5rem; }
    .stats-list__items { list-style: none; padding: 0; margin: 0; }
    .stats-list__item { display: grid; grid-template-columns: 1fr auto; gap: var(--space-md); align-items: center; padding: 0.5rem 0; border-bottom: 1px solid var(--border-subtle); font-family: var(--font-mono); font-size: 0.82rem; }
    .stats-list__item:last-child { border-bottom: none; }
    .stats-list__name { color: var(--text-secondary); word-break: break-word; }
    .stats-list__count { font-family: var(--font-display); font-weight: 700; color: var(--neon-cyan); font-size: 0.85rem; }
    .stats-list__empty { font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-muted); padding: 1rem 0; text-align: center; }
    .stats-loading { text-align: center; color: var(--text-muted); font-family: var(--font-mono); font-size: 0.85rem; padding: var(--space-2xl); }
    .stats-back { display: inline-flex; align-items: center; gap: 0.5rem; margin: var(--space-2xl) auto 0; padding: 0.85rem 1.5rem; background: transparent; border: 1.5px solid var(--neon-cyan); border-radius: 100px; font-family: var(--font-display); font-size: 0.75rem; font-weight: 700; color: var(--neon-cyan); letter-spacing: 0.1em; text-transform: uppercase; text-decoration: none; transition: var(--transition); }
    .stats-back:hover { background: var(--neon-cyan); color: var(--bg-primary); box-shadow: 0 0 25px rgba(0, 240, 255, 0.4); }
    .stats-back__wrap { text-align: center; }
    [data-theme="light"] .stats-summary__icon { background: rgba(0, 136, 204, 0.06); color: #0088cc; }
    [data-theme="light"] .stats-summary__value { background: linear-gradient(135deg, #0088cc, #7c3aed); -webkit-background-clip: text; background-clip: text; }
    [data-theme="light"] .stats-chart__title, [data-theme="light"] .stats-chart__bar-value, [data-theme="light"] .stats-list__title, [data-theme="light"] .stats-list__count, [data-theme="light"] .stats-back { color: #0088cc; }
    [data-theme="light"] .stats-chart__bar-fill { background: linear-gradient(180deg, #0088cc, #7c3aed); box-shadow: 0 0 12px rgba(0, 136, 204, 0.3); }
    [data-theme="light"] .stats-back { border-color: #0088cc; }
    [data-theme="light"] .stats-back:hover { background: #0088cc; color: #ffffff; }
    @media (max-width: 768px) { .stats-summary { grid-template-columns: 1fr; max-width: 320px; } .stats-chart { padding: var(--space-lg) var(--space-md); } .stats-chart__bars { height: 180px; gap: 0.35rem; } .stats-chart__bar { min-width: 26px; } .stats-lists { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <header class="header" data-header>
    <div class="header__scanline"></div>
    <div class="container header__container">
      <a href="index.html" class="logo" aria-label="Inicio">
        <div class="logo__symbol">
          <svg viewBox="0 0 100 100" class="logo__svg logo__svg--nexus">
            <path d="M50 4 L88 26 L88 62 Q88 88 50 96 Q12 88 12 62 L12 26 Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="240" stroke-dashoffset="240" class="nexus-shield"/>
            <circle cx="50" cy="50" r="42" fill="none" stroke="currentColor" stroke-width="0.8" opacity="0.3" stroke-dasharray="3 6" class="nexus-ring nexus-ring--1"/>
            <circle cx="50" cy="50" r="34" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5" stroke-dasharray="8 4" class="nexus-ring nexus-ring--2"/>
            <circle cx="50" cy="50" r="26" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.6" stroke-dasharray="2 3" class="nexus-ring nexus-ring--3"/>
            <path d="M50 50 L50 8 A42 42 0 0 1 85 28 Z" fill="currentColor" opacity="0.09" class="nexus-sweep"/>
            <path d="M50 38 L60 44 L60 56 L50 62 L40 56 L40 44 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" class="nexus-core"/>
            <circle cx="50" cy="50" r="4" fill="currentColor" class="nexus-center"/>
            <circle cx="50" cy="50" r="6" fill="none" stroke="currentColor" stroke-width="1.5" class="nexus-pulse nexus-pulse--1"/>
            <circle cx="50" cy="50" r="6" fill="none" stroke="currentColor" stroke-width="1.5" class="nexus-pulse nexus-pulse--2"/>
            <circle cx="50" cy="50" r="6" fill="none" stroke="currentColor" stroke-width="1.5" class="nexus-pulse nexus-pulse--3"/>
            <circle cx="50" cy="14" r="2.5" fill="currentColor" class="nexus-node nexus-node--1"/>
            <circle cx="81" cy="32" r="2.5" fill="currentColor" class="nexus-node nexus-node--2"/>
            <circle cx="81" cy="68" r="2.5" fill="currentColor" class="nexus-node nexus-node--3"/>
            <circle cx="50" cy="86" r="2.5" fill="currentColor" class="nexus-node nexus-node--4"/>
            <circle cx="19" cy="68" r="2.5" fill="currentColor" class="nexus-node nexus-node--5"/>
            <circle cx="19" cy="32" r="2.5" fill="currentColor" class="nexus-node nexus-node--6"/>
          </svg>
        </div>
      </a>

      <a href="index.html" class="nav__link nav__link--cta" style="margin-left:auto;">
        <i class="fa-solid fa-arrow-left"></i>&nbsp;VOLVER AL INICIO
      </a>
    </div>
  </header>

  <main class="stats-page">
    <div class="container">

      <header class="stats-page__header">
        <span class="section__eyebrow">[ ESTADÍSTICAS DEL SITIO ]</span>
        <h1 class="stats-page__title">Tráfico en tiempo real</h1>
        <p class="stats-page__lead">Datos agregados y anónimos. Sin cookies, sin rastreo personal.</p>
      </header>

      <div id="statsContent">
        <div class="stats-loading">
          <i class="fa-solid fa-circle-notch fa-spin"></i> Cargando estadísticas…
        </div>
      </div>

      <div class="stats-back__wrap">
        <a href="index.html" class="stats-back">
          <i class="fa-solid fa-arrow-left"></i> Volver al inicio
        </a>
      </div>

    </div>
  </main>

  <script src="js/stats-config.js"></script>
  <script src="js/estadisticas.js"></script>
</body>
</html>
